<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CSS Playground</title>
  <link href="./style.css" rel="stylesheet">
  <script src="./initial.js"></script>
</head>

<body>
  <!-- https://temoto.app/en/svg-icons/ -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display: none">
    <symbol id="ic_desktop" viewBox="0 0 24 24" fill="none" stroke="silver" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="18" height="12" x="3" y="4" rx="2" ry="2"></rect>
      <line x1="2" x2="22" y1="20" y2="20"></line>
    </symbol>
    <symbol id="ic_mobile" viewBox="0 0 24 24" fill="none" stroke="silver" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="20" x="5" y="2" rx="2" ry="2"></rect>
      <path d="M12 18h.01"></path>
    </symbol>
    <symbol id="ic_refresh" viewBox="0 0 24 24" fill="none" stroke="silver" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
      <path d="M3 3v5h5"></path>
      <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"></path>
      <path d="M16 16h5v5"></path>
    </symbol>
    <symbol id="ic_copy" viewBox="0 0 24 24" fill="none" stroke="silver" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect width="14" height="14" x="8" y="8" rx="2" ry="2"></rect>
      <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"></path>
    </symbol>
    <symbol id="ic_download" viewBox="0 0 24 24" fill="none" stroke="silver" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 15V3"></path>
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
      <path d="m7 10 5 5 5-5"></path>
    </symbol>
    <symbol id="ic_preview" viewBox="0 0 24 24" fill="none" stroke="silver" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
      </path>
      <circle cx="12" cy="12" r="3"></circle>
    </symbol>
    <symbol id="ic_source" viewBox="0 0 24 24" fill="none" stroke="silver" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m18 16 4-4-4-4"></path>
      <path d="m6 8-4 4 4 4"></path>
      <path d="m14.5 4-5 16"></path>
    </symbol>
  </svg>
  <main class="shell">
    <section class="workspace" aria-label="Playground workspace">
      <section class="card editor-card workspace-panel" id="panel-source" aria-label="Code editor" hidden>
        <header class="card-head">
          <div class="tabs" role="tablist" aria-label="Code language">
            <button class="tab" id="tab-html" role="tab" aria-selected="true" aria-controls="panel-html" tabindex="0" data-lang="html">
              <span class="dot html-dot"></span>
              <code>index.html</code>
            </button>
            <button class="tab" id="tab-css" role="tab" aria-selected="false" aria-controls="panel-css" tabindex="-1" data-lang="css">
              <span class="dot css-dot"></span>
              <code>styles.css</code>
            </button>
          </div>
          <div class="panel-tools">
            <span class="tool-label" id="languageLabel">HTML</span>
            <button class="small-btn" id="copyBtn" aria-label="Copy code" title="Copy code" type="button">
              <svg width="16" height="16">
                <use href="#ic_copy"></use>
              </svg>
            </button>
            <button class="small-btn" id="downloadBtn" aria-label="Export HTML" title="Export HTML" type="button">
              <svg width="16" height="16">
                <use href="#ic_download"></use>
              </svg>
            </button>
            <button class="small-btn" id="resetBtn" aria-label="Reset code" title="Reset code" type="button">
              <svg width="16" height="16">
                <use href="#ic_refresh"></use>
              </svg>
            </button>
            <button class="small-btn" id="showPreviewBtn" aria-label="Open preview" title="Preview" type="button">
              <svg width="16" height="16">
                <use href="#ic_preview"></use>
              </svg>
            </button>
          </div>
        </header>
        <div class="editor-area">
          <div class="line-nums" id="lineNums" aria-hidden="true"></div>
          <textarea class="code-editor" id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="HTML code editor" aria-multiline="true"></textarea>
        </div>
        <footer class="editor-foot">
          <span id="cursorInfo">Ln 1, Col 1</span>
          <span><strong id="languageFooter">HTML</strong> &nbsp;·&nbsp; UTF-8</span>
        </footer>
      </section>
      <section class="card preview-card workspace-panel" id="panel-preview" aria-label="Live preview">
        <header class="card-head">
          <div class="preview-head">
            <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="preview-title">Preview</span>
          </div>
          <div class="panel-tools">
            <span class="tool-label">Live</span>
            <div class="device" role="group" aria-label="Preview size">
              <button class="active" data-width="100%" aria-label="Desktop preview" title="Desktop" type="button">
                <svg width="16" height="16">
                  <use href="#ic_desktop"></use>
                </svg>
              </button>
              <button data-width="390px" aria-label="Mobile preview" title="Mobile" type="button">
                <svg width="16" height="16">
                  <use href="#ic_mobile"></use>
                </svg>
              </button>
            </div>
            <button class="small-btn" id="refreshBtn" aria-label="Refresh preview" title="Refresh preview" type="button">
              <svg width="16" height="16">
                <use href="#ic_refresh"></use>
              </svg>
            </button>
            <button class="small-btn" id="showSourceBtn" aria-label="Back to source code" title="Source code" type="button">
              <svg width="16" height="16">
                <use href="#ic_source"></use>
              </svg>
            </button>
          </div>
        </header>
        <iframe class="preview-frame" id="preview" title="Live HTML and CSS preview" sandbox="allow-scripts"></iframe>
        <footer class="preview-foot">
          <span class="live">Live preview</span>
          <span id="viewportLabel">Responsive · 100%</span>
        </footer>
      </section>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>

</html>
